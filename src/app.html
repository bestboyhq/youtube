<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181817" />
		<script>
			// Applies a theme chosen in the footer before the first paint; without one, the system decides.
			// A block, so its names stay out of the page's global scope.
			{
				const root = document.documentElement;
				try {
					const theme = localStorage.getItem('theme');
					if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
				} catch {
					// storage blocked: the system decides
				}

				// The browser's bars follow the theme: a chosen theme's color goes on every theme-color meta,
				// and the system's choice restores each meta's own color.
				const bars = [...document.querySelectorAll('meta[name="theme-color"]')].map((meta) => ({
					meta,
					scheme: meta.media.includes('dark') ? 'dark' : 'light',
					color: meta.content
				}));
				const paint = () => {
					const chosen = bars.find((bar) => bar.scheme === root.dataset.theme);
					for (const bar of bars) bar.meta.content = (chosen ?? bar).color;
				};
				paint();
				new MutationObserver(paint).observe(root, { attributeFilter: ['data-theme'] });
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
